version: "1.0"
specification:
  name: kafka
  summary: A Kafka source and destination plugin for Conduit, written in Go.
  description: |-
    ## Source

    A Kafka source connector is represented by a single consumer in a Kafka consumer
    group. By virtue of that, a source's logical position is the respective
    consumer's offset in Kafka. Internally, though, we're not saving the offset as
    the position: instead, we're saving the consumer group ID, since that's all
    which is needed for Kafka to find the offsets for our consumer.

    A source is associated with a consumer group ID when it is first opened. Set
    `groupID` to choose it; otherwise a random one is generated and kept in the
    position.

    ## Destination

    The destination connector writes records to Kafka.

    ### Output format

    The output format can be adjusted using configuration options provided by the
    connector SDK:

    - `sdk.record.format`: used to choose the format
    - `sdk.record.format.options`: used to configure the specifics of the chosen format

    See [this article](https://conduit.io/docs/connectors/output-formats) for more
    info on configuring the output format.

    ### Batching

    Batching can also be configured using connector SDK provided options:

    - `sdk.batch.size`: maximum number of records in batch before it gets written to
      the destination (defaults to 0, no batching)
    - `sdk.batch.delay`: maximum delay before an incomplete batch is written to the
      destination (defaults to 0, no limit)

    ## Delivery semantics

    These are the guarantees that the connector's CI checks with the SDK
    acceptance suite v2 and a kill -9 test, and the conditions under which they
    hold.

    ### Source guarantees

    - **At-least-once.** The source commits a record's offset to its consumer group
      only after Conduit acknowledged the record. It never commits an offset it
      has not been acked for.
    - **Commits are batched**, so a restart after a crash re-delivers records:
      offsets are committed after every `commitOffsetsSize` acks (default 1000),
      every `commitOffsetsDelay` (default 5s), and when the pipeline stops
      gracefully. After a crash (kill -9, power loss) the source re-delivers at
      most the records acked since the last commit, fewer than `commitOffsetsSize`
      when commits succeed. Setting `commitOffsetsSize` to 1 commits on every ack
      and lowers throughput.
    - **Ordering:** records of one partition are delivered in offset order, so
      records with the same key (which Kafka keeps in one partition) arrive in the
      order they were written. Re-delivery after a restart repeats a suffix of each
      partition, in order. There is no order between partitions.
    - **Resume uses the consumer group**, not the offset in the Conduit position.
      If the group's committed offsets are gone (the group was deleted, or the
      pipeline was stopped longer than the broker's `offsets.retention.minutes`,
      7 days by default), the source starts where `readFromBeginning` says: from
      the beginning of the topic (re-delivery), or from the end, which **skips the
      records written while the pipeline was stopped**. Use
      `readFromBeginning: true` where skipping is not acceptable.
    - **Restart after a crash can pause.** The crashed instance stays a member of
      the consumer group until the broker's session timeout expires (45s by
      default), and the partitions it held are not consumed until then.

    ### Destination guarantees

    - **At-least-once.** A record is acknowledged to Conduit only after the broker
      confirmed it. With `acks: all` (the default) that means the in-sync replicas
      have it. `acks: one` acknowledges after the leader alone has it, and a leader
      failure can lose acknowledged records; `acks: none` acknowledges without any
      confirmation. Only `acks: all` keeps the at-least-once guarantee.
    - **Not idempotent.** A record that is replayed after a crash is written again.
      The idempotent producer (on with `acks: all`) removes duplicates from its own
      retries of a produce request, not from a record sent twice.
    - **Ordering:** records with the same key go to the same partition (key hash)
      in the order Conduit wrote them, as long as the partition count of the topic
      does not change. One exception: if the broker rejects a record after it was
      enqueued (for example `MESSAGE_TOO_LARGE`), the later records of the same
      batch may already be written. Conduit is told the batch failed from that
      record on, and when the records are replayed the rejected record is stored
      after them, together with duplicates of them.
    - **Writes can wait for an unreachable broker without a bound** when
      `deliveryTimeout` is 0 (the default). Cancelling the pipeline ends the wait
      and nacks the records; nothing unconfirmed is acknowledged.
    - **Large records:** a record must fit in `batchBytes` (default 1000012 bytes)
      and in the topic's `max.message.bytes`, after the output format is applied.
      The default `opencdc/json` format base64-encodes raw payloads, which adds
      about a third. The acceptance suite writes 1 MiB records with `batchBytes`
      and the topic's `max.message.bytes` set to 4 MiB.

    ### Acceptance suite claims and waivers

    The acceptance suite v2 run (revision 2.0.0) claims per-key ordering for the
    source, a redelivery bound of 1000 records after a restart, and a
    non-idempotent destination. Three points were decided by the maintainer
    (DeVaris Brown, 2026-10-15):

    - **`max_redelivery` waived at 1000.** The suite's default bound is 10; the
      source's bound is `commitOffsetsSize` (default 1000), and both the suite's
      restart case and the kill -9 test check it. Certifying at a
      `commitOffsetsSize` of 10 or less would certify a configuration users do
      not run.
    - **Destination per-key ordering is not claimed**, although the suite's
      ordering case passes, because of the exception above: a record the broker
      rejects after it was enqueued is stored after later records of its batch
      when the batch is replayed.
    - **The suite's process-death hook is accepted.** The suite kills a source
      in-process, which leaves its consumer group membership alive; the hook
      closes the killed source's client without committing, as the end of the
      process would. A real process kill is covered by the kill -9 test.
  version: v0.13.0
  author: Meroxa, Inc.
  source:
    parameters:
      - name: servers
        description: |-
          Servers is a list of Kafka bootstrap servers, which will be used to
          discover all the servers in a cluster.
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: topics
        description: Topics is a comma separated list of Kafka topics to read from.
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: caCert
        description: CACert is the Kafka broker's certificate.
        type: string
        default: ""
        validations: []
      - name: clientCert
        description: ClientCert is the Kafka client's certificate.
        type: string
        default: ""
        validations: []
      - name: clientID
        description: |-
          ClientID is a unique identifier for client connections established by
          this connector.
        type: string
        default: conduit-connector-kafka
        validations: []
      - name: clientKey
        description: ClientKey is the Kafka client's private key.
        type: string
        default: ""
        validations: []
      - name: commitOffsetsDelay
        description: CommitOffsetsDelay defines how often consumed offsets should be committed.
        type: duration
        default: 5s
        validations: []
      - name: commitOffsetsSize
        description: CommitOffsetsSize defines the maximum number of consumed offsets to be committed at a time.
        type: int
        default: "1000"
        validations:
          - type: greater-than
            value: "-1"
      - name: groupID
        description: GroupID defines the consumer group id.
        type: string
        default: ""
        validations: []
      - name: insecureSkipVerify
        description: |-
          InsecureSkipVerify defines whether to validate the broker's certificate
          chain and host name. If 'true', accepts any certificate presented by the
          server and any host name in that certificate.
        type: bool
        default: ""
        validations: []
      - name: readFromBeginning
        description: |-
          ReadFromBeginning determines from whence the consumer group should begin
          consuming when it finds a partition without a committed offset. If this
          options is set to true it will start with the first message in that
          partition.
        type: bool
        default: ""
        validations: []
      - name: retryGroupJoinErrors
        description: RetryGroupJoinErrors determines whether the connector will continually retry on group join errors.
        type: bool
        default: "true"
        validations: []
      - name: saslMechanism
        description: |-
          Mechanism configures the connector to use SASL authentication. If
          empty, no authentication will be performed.
        type: string
        default: ""
        validations:
          - type: inclusion
            value: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      - name: saslPassword
        description: Password sets up the password used with SASL authentication.
        type: string
        default: ""
        validations: []
      - name: saslUsername
        description: Username sets up the username used with SASL authentication.
        type: string
        default: ""
        validations: []
      - name: tls.enabled
        description: TLSEnabled defines whether TLS is needed to communicate with the Kafka cluster.
        type: bool
        default: ""
        validations: []
      - name: sdk.batch.delay
        description: Maximum delay before an incomplete batch is read from the source.
        type: duration
        default: "0"
        validations: []
      - name: sdk.batch.size
        description: Maximum size of batch before it gets read from the source.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.schema.context.enabled
        description: |-
          Specifies whether to use a schema context name. If set to false, no schema context name will
          be used, and schemas will be saved with the subject name specified in the connector
          (not safe because of name conflicts).
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.context.name
        description: |-
          Schema context name to be used. Used as a prefix for all schema subject names.
          If empty, defaults to the connector ID.
        type: string
        default: ""
        validations: []
      - name: sdk.schema.extract.key.enabled
        description: Whether to extract and encode the record key with a schema.
        type: bool
        default: "false"
        validations: []
      - name: sdk.schema.extract.key.subject
        description: |-
          The subject of the key schema. If the record metadata contains the field
          "opencdc.collection" it is prepended to the subject name and separated
          with a dot.
        type: string
        default: key
        validations: []
      - name: sdk.schema.extract.payload.enabled
        description: Whether to extract and encode the record payload with a schema.
        type: bool
        default: "false"
        validations: []
      - name: sdk.schema.extract.payload.subject
        description: |-
          The subject of the payload schema. If the record metadata contains the
          field "opencdc.collection" it is prepended to the subject name and
          separated with a dot.
        type: string
        default: payload
        validations: []
      - name: sdk.schema.extract.type
        description: The type of the payload schema.
        type: string
        default: avro
        validations:
          - type: inclusion
            value: avro
  destination:
    parameters:
      - name: servers
        description: |-
          Servers is a list of Kafka bootstrap servers, which will be used to
          discover all the servers in a cluster.
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: acks
        description: |-
          Acks defines the number of acknowledges from partition replicas required
          before receiving a response to a produce request.
          None = fire and forget, one = wait for the leader to acknowledge the
          writes, all = wait for the full ISR to acknowledge the writes.
        type: string
        default: all
        validations:
          - type: inclusion
            value: none,one,all
      - name: batchBytes
        description: |-
          BatchBytes limits the maximum size of a request in bytes before being
          sent to a partition. This mirrors Kafka's max.message.bytes.
        type: int
        default: "1000012"
        validations: []
      - name: caCert
        description: CACert is the Kafka broker's certificate.
        type: string
        default: ""
        validations: []
      - name: clientCert
        description: ClientCert is the Kafka client's certificate.
        type: string
        default: ""
        validations: []
      - name: clientID
        description: |-
          ClientID is a unique identifier for client connections established by
          this connector.
        type: string
        default: conduit-connector-kafka
        validations: []
      - name: clientKey
        description: ClientKey is the Kafka client's private key.
        type: string
        default: ""
        validations: []
      - name: compression
        description: Compression set the compression codec to be used to compress messages.
        type: string
        default: snappy
        validations:
          - type: inclusion
            value: none,gzip,snappy,lz4,zstd
      - name: deliveryTimeout
        description: DeliveryTimeout for write operation performed by the Writer.
        type: duration
        default: ""
        validations: []
      - name: insecureSkipVerify
        description: |-
          InsecureSkipVerify defines whether to validate the broker's certificate
          chain and host name. If 'true', accepts any certificate presented by the
          server and any host name in that certificate.
        type: bool
        default: ""
        validations: []
      - name: saslMechanism
        description: |-
          Mechanism configures the connector to use SASL authentication. If
          empty, no authentication will be performed.
        type: string
        default: ""
        validations:
          - type: inclusion
            value: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      - name: saslPassword
        description: Password sets up the password used with SASL authentication.
        type: string
        default: ""
        validations: []
      - name: saslUsername
        description: Username sets up the username used with SASL authentication.
        type: string
        default: ""
        validations: []
      - name: tls.enabled
        description: TLSEnabled defines whether TLS is needed to communicate with the Kafka cluster.
        type: bool
        default: ""
        validations: []
      - name: topic
        description: |-
          Topic is the Kafka topic. It can contain a [Go template](https://pkg.go.dev/text/template)
          that will be executed for each record to determine the topic. By default,
          the topic is the value of the `opencdc.collection` metadata field.
        type: string
        default: '{{ index .Metadata "opencdc.collection" }}'
        validations: []
      - name: sdk.batch.delay
        description: Maximum delay before an incomplete batch is written to the destination.
        type: duration
        default: "0"
        validations: []
      - name: sdk.batch.size
        description: Maximum size of batch before it gets written to the destination.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.rate.burst
        description: |-
          Allow bursts of at most X records (0 or less means that bursts are not
          limited). Only takes effect if a rate limit per second is set. Note that
          if `sdk.batch.size` is bigger than `sdk.rate.burst`, the effective batch
          size will be equal to `sdk.rate.burst`.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.rate.perSecond
        description: Maximum number of records written per second (0 means no rate limit).
        type: float
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.record.format
        description: |-
          The format of the output record. See the Conduit documentation for a full
          list of supported formats (https://conduitdata.io/docs/using/connectors/configuration-parameters/output-format).
        type: string
        default: opencdc/json
        validations: []
      - name: sdk.record.format.options
        description: |-
          Options to configure the chosen output record format. Options are normally
          key=value pairs separated with comma (e.g. opt1=val2,opt2=val2), except
          for the `template` record format, where options are a Go template.
        type: string
        default: ""
        validations: []
      - name: sdk.schema.extract.key.enabled
        description: Whether to extract and decode the record key with a schema.
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.extract.payload.enabled
        description: Whether to extract and decode the record payload with a schema.
        type: bool
        default: "true"
        validations: []
