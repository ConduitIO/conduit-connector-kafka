services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.5@sha256:95182a95a80f187a99cfe9fa03aaf18da0a3809a6741a229572f7ec33e795c13
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    healthcheck:
      # Without this, `docker compose up --wait` returns as soon as the container
      # is running and tests race the broker's startup.
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 5s
    ports:
      - 9092:9092
      - 29092:29092
