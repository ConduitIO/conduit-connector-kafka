services:
  kafka:
    image: apache/kafka-native:4.3.1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      # health checks happen every 2s, failures in the first 30s are not counted toward the maximum number of retries,
      # after 5 failed health checks the service is marked as unhealthy
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # Setting any KAFKA_* variable replaces the image's whole default
      # configuration (/etc/kafka/docker/server.properties), so its single-node
      # KRaft settings are repeated here unchanged. The only difference is the
      # advertised listener: it must name the published host port (KAFKA_PORT,
      # default 9092) or clients are redirected to a port nothing listens on.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
